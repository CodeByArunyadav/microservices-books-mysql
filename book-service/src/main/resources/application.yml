server:
  port: 8082
  forward-headers-strategy: framework
jwt:
    secret: mySuperSecretKeyForJwtAuthentication123456
spring:
  application:
    name: BOOK-SERVICE
  datasource:
    #url: jdbc:mysql://localhost:3306/booksdb?useSSL=false&allowPublicKeyRetrieval=true
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  client:
    service-url:
      #defaultZone: 'http://eureka-server:8761/eureka'
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
  
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
