server:
  port: 8081
  forward-headers-strategy: framework
jwt:
  secret: mySuperSecretKeyForJwtAuthentication123456
spring:
  application:
    name: AUTHOR-SERVICE
  datasource:
    #url: jdbc:mysql://localhost:3306/booksdb?useSSL=false&allowPublicKeyRetrieval=true
    url: jdbc:mysql://localhost:3306/booksdb?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always