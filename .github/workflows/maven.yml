# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build Changed Microservices

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      eureka: ${{ steps.filter.outputs.eureka }}
      gateway: ${{ steps.filter.outputs.gateway }}
      author: ${{ steps.filter.outputs.author }}
      book: ${{ steps.filter.outputs.book }}
      rating: ${{ steps.filter.outputs.rating }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            eureka:
              - 'eureka-server/**'
            gateway:
              - 'api-gateway/**'
            author:
              - 'author-service/**'
            book:
              - 'book-service/**'
            rating:
              - 'rating-service/**'

  build-eureka:
    needs: changes
    if: needs.changes.outputs.eureka == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Eureka Server
        working-directory: eureka-server
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Eureka Image
        working-directory: eureka-server
        run: |
          docker build -t codebyarunyadav/eureka-server:${{ github.sha }} .
          docker push codebyarunyadav/eureka-server:${{ github.sha }}

  build-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build API Gateway
        working-directory: api-gateway
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Gateway Image
        working-directory: api-gateway
        run: |
          docker build -t codebyarunyadav/api-gateway:latest .
          docker build -t codebyarunyadav/api-gateway:${{ github.sha }} .
          docker push codebyarunyadav/api-gateway:latest
          docker push codebyarunyadav/api-gateway:${{ github.sha }}

  build-author:
    needs: changes
    if: needs.changes.outputs.author == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Author Service
        working-directory: author-service
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Author Image
        working-directory: author-service
        run: |
          docker build -t codebyarunyadav/author-service:latest .
          docker build -t codebyarunyadav/author-service:${{ github.sha }} .
          docker push codebyarunyadav/author-service:latest
          docker push codebyarunyadav/author-service:${{ github.sha }}

  build-book:
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Book Service
        working-directory: book-service
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Book Image
        working-directory: book-service
        run: |
          docker build -t codebyarunyadav/book-service:latest .
          docker build -t codebyarunyadav/book-service:${{ github.sha }} .
          docker push codebyarunyadav/book-service:latest
          docker push codebyarunyadav/book-service:${{ github.sha }}

  build-rating:
    needs: changes
    if: needs.changes.outputs.rating == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Rating Service
        working-directory: rating-service
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Rating Image
        working-directory: rating-service
        run: |
          docker build -t codebyarunyadav/rating-service:latest .
          docker build -t codebyarunyadav/rating-service:${{ github.sha }} .
          docker push codebyarunyadav/rating-service:latest
          docker push codebyarunyadav/rating-service:${{ github.sha }}
          password: ${{ secrets.DOCKER_PASSWORD }}



